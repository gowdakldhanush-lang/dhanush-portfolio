<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphic Design | Dhanush Gowda K L</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <a href="index.html" class="logo-container">
      <span class="sunburst-icon-small">✱</span>
      <span class="logo">dhanush.</span>
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#projects">Works</a>
      <a href="index.html#contact">Contact</a>
    </div>
    <a href="index.html#contact" class="btn btn-secondary" style="padding: 10px 20px; font-size: 0.875rem;">Let's talk</a>
  </nav>

  <main>
    <section class="page-header fade-in">
      <span class="sunburst-icon">✱</span>
      <h1>GRAPHIC DESIGN</h1>
    </section>

    <div class="container fade-in">
      <div class="grid">
        <!-- Graphic Design 1 -->
        <div class="card" data-type="image" data-src="images/IMG-20260417-WA0005.jpg.jpeg">
          <img src="images/IMG-20260417-WA0005.jpg.jpeg" alt="Graphic Design 1" style="width: 100%; height: 100%; object-fit: cover; border-radius: var(--border-radius);">
          <div class="card-overlay">
            <span class="card-label">ARTWORK 1</span>
          </div>
        </div>
        <!-- Graphic Design 2 -->
        <div class="card" data-type="image" data-src="images/WhatsApp Image 2026-05-12 at 1.20.43 PM.jpeg">
          <img src="images/WhatsApp Image 2026-05-12 at 1.20.43 PM.jpeg" alt="Graphic Design 2" style="width: 100%; height: 100%; object-fit: cover; border-radius: var(--border-radius);">
          <div class="card-overlay">
            <span class="card-label">ARTWORK 2</span>
          </div>
        </div>
        <!-- Graphic Design 3 -->
        <div class="card" data-type="image" data-src="images/communiti artwork 2.5ft(w) 4ft(h).jpg">
          <img src="images/communiti artwork 2.5ft(w) 4ft(h).jpg" alt="Graphic Design 3" style="width: 100%; height: 100%; object-fit: cover; border-radius: var(--border-radius);">
          <div class="card-overlay">
            <span class="card-label">COMMUNITI ARTWORK</span>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div class="modal" id="modal">
    <button class="modal-close">&times;</button>
    <div class="modal-content" id="modal-content-container">
      <!-- Injected by JS -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
