<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphic Design | Dhanush Gowda K L</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <a href="index.html" class="logo-container">
      <span class="sunburst-icon-small">✱</span>
      <span class="logo">dhanush.</span>
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#projects">Works</a>
      <a href="index.html#contact">Contact</a>
    </div>
    <a href="index.html#contact" class="btn btn-secondary" style="padding: 10px 20px; font-size: 0.875rem;">Let's talk</a>
  </nav>

  <main>
    <section class="page-header fade-in">
      <span class="sunburst-icon">✱</span>
      <h1>GRAPHIC DESIGN</h1>
    </section>

    <div class="container fade-in">
      <div class="grid">
        <!-- ARTWORK -->
        <div class="card" data-type="album" data-album="artwork" style="display: flex; justify-content: center; align-items: center;">
          <span class="card-label" style="color: var(--text-primary); font-size: 2rem;">ARTWORK</span>
        </div>

        <!-- Book Card -->
        <div class="card" data-type="book" style="display: flex; justify-content: center; align-items: center;">
          <span class="card-label" style="color: var(--text-primary); font-size: 2rem;">BOOK</span>
        </div>

        <!-- Post Card -->
        <div class="card" data-type="multi-carousel" data-id="carousels" style="display: flex; justify-content: center; align-items: center;">
          <span class="card-label" style="color: var(--text-primary); font-size: 2rem;">POST</span>
        </div>

      </div>
    </div>
  </main>

  <div class="modal" id="modal">
    <button class="modal-close">&times;</button>
    <div class="modal-content" id="modal-content-container">
      <!-- Injected by JS -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
