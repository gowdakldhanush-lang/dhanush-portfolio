<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Design & Development | Dhanush Gowda K L</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <a href="index.html" class="logo-container">
      <span class="sunburst-icon-small">✱</span>
      <span class="logo">dhanush.</span>
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="index.html#about">About</a>
      <a href="index.html#projects">Works</a>
      <a href="index.html#contact">Contact</a>
    </div>
    <a href="index.html#contact" class="btn btn-secondary" style="padding: 10px 20px; font-size: 0.875rem;">Let's talk</a>
  </nav>

  <main>
    <section class="page-header fade-in">
      <span class="sunburst-icon">✱</span>
      <h1>WEBSITE DESIGN & DEVELOPMENT</h1>
    </section>

    <div class="container fade-in">
      <div class="grid">
        <!-- Communiti India Card -->
        <a href="https://communitiindia.com/" target="_blank" class="card web-card" data-type="link">
          <img src="images/website 1.png" alt="Communiti India" style="width: 100%; height: 100%; object-fit: cover; border-radius: var(--border-radius);">
          <div class="card-overlay">
            <span class="card-label">Communiti India</span>
          </div>
        </a>
        <!-- vNeighborhood Card -->
        <a href="https://vneighborhood.in/" target="_blank" class="card web-card" data-type="link">
          <img src="images/website 2.png" alt="vNeighborhood" style="width: 100%; height: 100%; object-fit: cover; border-radius: var(--border-radius);">
          <div class="card-overlay">
            <span class="card-label">vNeighborhood</span>
          </div>
        </a>
        <!-- Fennys Card -->
        <a href="https://fennys.in/" target="_blank" class="card web-card" data-type="link">
          <img src="images/website 3.png" alt="Fennys" style="width: 100%; height: 100%; object-fit: cover; border-radius: var(--border-radius);">
          <div class="card-overlay">
            <span class="card-label">Fennys</span>
          </div>
        </a>
      </div>
    </div>
  </main>

  <div class="modal" id="modal">
    <button class="modal-close">&times;</button>
    <div class="modal-content" id="modal-content-container">
      <!-- Injected by JS -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
